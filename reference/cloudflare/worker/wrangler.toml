# an okay-faces application on Cloudflare Workers: `npx wrangler dev`, `npx wrangler deploy`
# main.js: `sbt -Dplatforms=jvm,js referenceCloudflareJS/worker`, or deploy.sh
name = "okay-ui-expenses"
main = "entry.js"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "OKAY_FACES_SESSIONS"
class_name = "OkayFacesSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OkayFacesSession"]
